name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Svelte UI (to data/app, gzipped)
        run: |
          cd ui
          npm install
          npm run build

      - name: Install driver build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          pip install platformio cryptography

      # الدرايفرات المُودَعة في drivers/build (التي يجلبها متجر الواجهة) يجب أن تكون صالحة للتوقيع الحالي ونسخة الواجهة
      - name: Verify committed drivers and store logic
        run: |
          python3 tools/drv/test_drivers.py drivers/build
          g++ -std=gnu++17 -O2 -Isrc tools/drv/test_vm.cpp src/drv_vm.cpp -o /tmp/test_vm
          /tmp/test_vm drivers/build/*.drv
          node tools/drv/test_store.mjs

      - name: Build, sign and test drivers from source
        run: |
          DRV_VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || DRV_VER="1.0"
          python3 tools/drv/build_index.py --version "$DRV_VER" --out-dir dist-drivers
          python3 tools/drv/test_drivers.py dist-drivers
          g++ -std=gnu++17 -O2 -Isrc tools/drv/test_vm.cpp src/drv_vm.cpp -o /tmp/test_vm
          /tmp/test_vm dist-drivers/*.drv

      # نفس FW_VERSION لكل خطوات pio، وإلا يعتبره PlatformIO تغيّراً في الإعدادات ويمسح مجلد البناء
      - name: Set firmware version
        run: |
          VER="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VER="dev-${GITHUB_SHA::7}"
          echo "PLATFORMIO_BUILD_FLAGS=-DFW_VERSION=\\\"$VER\\\"" >> "$GITHUB_ENV"

      - name: Build firmware
        run: pio run

      - name: Build LittleFS image (only if data/ exists)
        run: |
          if [ -d data ]; then pio run -t buildfs; fi

      - name: Collect artifacts
        run: |
          VER="${GITHUB_REF_NAME//\//-}"
          B=.pio/build/esp32-c3-devkitm-1
          mkdir -p dist
          cp $B/firmware.bin   dist/firmware-$VER.bin
          cp $B/bootloader.bin dist/bootloader-$VER.bin
          cp $B/partitions.bin dist/partitions-$VER.bin
          [ -f $B/littlefs.bin ] && cp $B/littlefs.bin dist/littlefs-$VER.bin || true
          cp dist-drivers/*.drv dist-drivers/*.lua dist-drivers/index.json dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
